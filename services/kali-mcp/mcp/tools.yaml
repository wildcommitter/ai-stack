# Catalog / allowlist of tools the MCP server exposes via `run_tool`.
#
# This is the UNION of the tool lists from the public Kali MCP servers
# (chfle/Pentest-MCP-Server, JesseEikeland/kali-mcp, andrew-stclair/kali-mcp-server,
# openbashok/pentest-mcp, cyberillo/kali-mcp-server and the mcp-kali-tools image)
# plus additions that are broadly useful in red-team work.
#
# The descriptions below are only FALLBACKS. scripts/gen-descriptions.sh runs
# `tldr <tool>` (tealdeer) INSIDE the container and writes mcp/descriptions.json;
# list_tools prefers those generated descriptions and falls back to these.
#
# The generic `run_bash` tool can run anything; this catalog exists so an AI
# client gets a discoverable, named, validated menu. Binaries not present in the
# image are flagged "installed: false" by list_tools (it probes `command -v`).

